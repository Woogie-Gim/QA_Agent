<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>QA Agent</title>
    <style>
      body { font-family: "Segoe UI", sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 20px; margin: 0; }
      h1 { color: #60a5fa; margin-bottom: 16px; }
      .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
      button:hover { background: #1d4ed8; }
      #devices { list-style: none; padding: 0; color: #9ca3af; }
      #log { background: #0d0d0d; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; height: 300px; overflow-y: auto; margin-top: 12px; }
      #scenario { background: #0d0d0d; padding: 12px; border-radius: 6px; font-size: 12px; max-height: 200px; overflow-y: auto; color: #9ca3af; }
      img#preview { max-width: 280px; border-radius: 6px; margin-top: 12px; display: none; }
    </style>
  </head>
  <body>
    <h1>QA Agent</h1>
    <div class="toolbar">
      <button id="check">기기 확인</button>
      <button id="shot">스크린샷</button>
      <button id="load">시나리오 불러오기</button>
      <button id="run">시나리오 실행</button>
      <button id="inspect">트리 확인</button>
    </div>

    <ul id="devices"></ul>
    <div id="preview-wrap" style="position: relative; display: inline-block; margin-top: 12px;">
      <img id="preview" style="max-width: 280px; border-radius: 6px; display: none;" />
      <div id="tap-dot" style="position: absolute; width: 12px; height: 12px; background: red; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none;"></div>
    </div>
    <div id="log"></div>
    <pre id="scenario"></pre>

    <script>
      let loadedScenario = null;

      // 기기 확인 (어제 코드 그대로)
      document.getElementById("check").addEventListener("click", async () => {
        const devices = await window.api.getDevices();
        const ul = document.getElementById("devices");
        ul.innerHTML = devices.length ? "" : "<li>연결된 기기 없음</li>";
        for (const d of devices) {
          const li = document.createElement("li");
          li.textContent = "기기: " + d;
          ul.appendChild(li);
        }
      });

      // 스크린샷 찍고 미리보기 표시
      document.getElementById("shot").addEventListener("click", async () => {
        const res = await window.api.screenshot();
        if (!res.ok) { alert(res.message); return; }
        const img = document.getElementById("preview");
        img.src = "file://" + res.path + "?t=" + Date.now();
        img.style.display = "block";
      });

      // 불러오기 버튼에서 시나리오를 변수에 저장해두기 (기존 load 핸들러 수정)
      document.getElementById("load").addEventListener("click", async () => {
        const scenario = await window.api.loadScenario();
        if (!scenario) return;
        loadedScenario = scenario;
        document.getElementById("scenario").textContent = JSON.stringify(scenario, null, 2);
      });

      // 실시간 진행 로그 수신
      window.api.onStepProgress((r) => {
        const log = document.getElementById("log");
        const color = r.verdict === "PASS" ? "#4ade80" : "#f87171";
        log.innerHTML += `<div style="color:${color}">[${r.verdict}] 스텝${r.step} ${r.name} — ${r.reason}</div>`;
        log.scrollTop = log.scrollHeight;

        // 좌표 있으면 스크린샷에 탭 위치 표시
        if (r.screenshot && r.x != null) {
          showTapPoint(r.screenshot, r.x, r.y);
        }
      });

      // 스크린샷 위에 탭 좌표를 빨간 점으로 표시
      function showTapPoint(shotPath, x, y) {
        const wrap = document.getElementById("preview-wrap");
        const img = document.getElementById("preview");
        img.onload = () => {
          // 실제 이미지 해상도 대비 표시 크기 비율로 점 위치 환산
          const scaleX = img.clientWidth / img.naturalWidth;
          const scaleY = img.clientHeight / img.naturalHeight;
          const dot = document.getElementById("tap-dot");
          dot.style.left = (x * scaleX) + "px";
          dot.style.top = (y * scaleY) + "px";
          dot.style.display = "block";
        };
        img.src = "file://" + shotPath + "?t=" + Date.now();
        img.style.display = "block";
      }

      // 실행 버튼
      document.getElementById("run").addEventListener("click", async () => {
        if (!loadedScenario) { alert("먼저 시나리오를 불러오세요."); return; }

        // 실행 중 버튼 비활성화. 중복 실행 방지
        const runBtn = document.getElementById("run");
        runBtn.disabled = true;
        runBtn.textContent = "실행 중...";

        document.getElementById("log").innerHTML = "";
        try {
          const { report } = await window.api.runScenario(loadedScenario);
          const log = document.getElementById("log");
          log.innerHTML += `<div style="color:#fbbf24">완료: 전체 ${report.total} / PASS ${report.pass} / FAIL ${report.fail}</div>`;
          log.innerHTML += `<div style="color:#60a5fa">리포트: ${report.path}</div>`;
        } finally {
          // 성공/실패 관계없이 버튼 복구
          runBtn.disabled = false;
          runBtn.textContent = "시나리오 실행";
        }
      });
      
      // 트리 확인 버튼
      document.getElementById("inspect").addEventListener("click", async () => {
        const res = await window.api.inspectTree();
        const log = document.getElementById("log");
        if (!res.ok) { alert(res.message); return; }
        log.innerHTML = `<div style="color:#fbbf24">현재 화면 요소 ${res.elements.length}개</div>`;
        for (const e of res.elements) {
          log.innerHTML += `<div style="color:#9ca3af">"${e.label}" → [${e.center[0]}, ${e.center[1]}]</div>`;
        }
      });
    </script>
  </body>
</html>
